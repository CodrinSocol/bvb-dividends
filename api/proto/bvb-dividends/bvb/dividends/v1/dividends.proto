// Copyright 2026 The BVB Dividends Authors.
//
// The dividends slice of the public API: dividends announced by companies
// listed on the Bucharest Stock Exchange.

syntax = "proto3";

package bvb.dividends.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/money.proto";

option go_package = "github.com/CodrinSocol/bvb-dividends-ro/libs/go/gen/v1;bvbdividendsv1";
option java_multiple_files = true;
option java_outer_classname = "DividendsProto";
option java_package = "com.bvb.dividends.v1";

// Read-only access to the dividends announced on the Bucharest Stock Exchange.
//
// Data is imported from the BVB financials web service on a daily schedule.
// Every method is public, unauthenticated, safe and idempotent.
service DividendsService {
  option (google.api.default_host) = "bvb-dividends.example.com";

  // Lists the dividends announced by a company.
  //
  // To list dividends across all companies, use `-` as the company ID in
  // `parent`, for example `companies/-`.
  rpc ListDividends(ListDividendsRequest) returns (ListDividendsResponse) {
    option (google.api.http) = {get: "/v1/{parent=companies/*}/dividends"};
    option (google.api.method_signature) = "parent";
  }

  // Gets a single dividend.
  rpc GetDividend(GetDividendRequest) returns (Dividend) {
    option (google.api.http) = {get: "/v1/{name=companies/*/dividends/*}"};
    option (google.api.method_signature) = "name";
  }
}

// A dividend announced by a company listed on the Bucharest Stock Exchange.
//
// A dividend is identified by the company that declared it, the fiscal year it
// relates to, its type, and its ex-dividend date. That tuple is stable across
// imports, so a dividend keeps the same resource name for its whole lifetime.
message Dividend {
  option (google.api.resource) = {
    type: "bvb-dividends.example.com/Dividend"
    pattern: "companies/{company}/dividends/{dividend}"
    singular: "dividend"
    plural: "dividends"
  };

  // The stage a dividend has reached in its lifecycle.
  //
  // Derived from the schedule at read time; it is not stored.
  enum State {
    // The default value. This value is unused.
    STATE_UNSPECIFIED = 0;

    // Announced, and the ex-dividend date is still in the future. Buying the
    // share today still entitles the holder to this dividend.
    STATE_ANNOUNCED = 1;

    // The ex-dividend date has passed but payment has not started.
    STATE_EX_PASSED = 2;

    // The payment window is currently open.
    STATE_PAYING = 3;

    // The payment window has closed.
    STATE_PAID = 4;

    // BVB did not report an ex-dividend date, so the stage cannot be derived.
    STATE_UNDATED = 5;
  }

  // Identifier. The resource name of the dividend.
  //
  // Format: `companies/{company}/dividends/{dividend}`, for example
  // `companies/SNP/dividends/8f14e45f-ceea-5a04-a6f3-2f4b1a9c0d33`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The fiscal year the dividend relates to, for example `2025`.
  int32 year = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The type of dividend as reported by BVB, for example `cash`.
  //
  // This is an open set owned by BVB rather than by this API, so it is
  // represented as a string and passed through unmodified.
  string dividend_type = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Gross dividend per share payable to natural persons, before
  // withholding tax.
  google.type.Money gross_per_share_natural_person = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Gross dividend per share payable to legal persons, before
  // withholding tax.
  google.type.Money gross_per_share_legal_person = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The total amount distributed across all shares.
  google.type.Money total_amount = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The key dates of the dividend.
  Schedule schedule = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. How the dividend is paid out, as described by BVB, for example
  // `bank transfer`.
  string distribution_method = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The stage this dividend has reached, derived from `schedule`
  // at the time of the request.
  State state = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time this dividend was first imported from BVB.
  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time this dividend was last refreshed from BVB.
  google.protobuf.Timestamp update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The key dates of a dividend.
//
// Every date is optional: BVB publishes them progressively as a dividend moves
// from announcement to payment, so an early-stage dividend has most of these
// unset. Absent dates are unset rather than zero.
message Schedule {
  // The date the dividend was announced.
  google.type.Date announcement_date = 1 [(google.api.field_behavior) = OPTIONAL];

  // The reference date used for the general meeting of shareholders.
  google.type.Date gms_reference_date = 2 [(google.api.field_behavior) = OPTIONAL];

  // The date of the general meeting of shareholders that approved the dividend.
  google.type.Date gms_date = 3 [(google.api.field_behavior) = OPTIONAL];

  // The date on which share ownership is recorded for entitlement.
  google.type.Date record_date = 4 [(google.api.field_behavior) = OPTIONAL];

  // The first date on which the share trades without entitlement to this
  // dividend. Buying on or after this date does not earn the dividend.
  google.type.Date ex_dividend_date = 5 [(google.api.field_behavior) = OPTIONAL];

  // The first date on which the dividend is paid.
  google.type.Date payment_start_date = 6 [(google.api.field_behavior) = OPTIONAL];

  // The last date on which the dividend is paid.
  google.type.Date payment_end_date = 7 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for
// [DividendsService.ListDividends][bvb.dividends.v1.DividendsService.ListDividends].
message ListDividendsRequest {
  // Required. The company whose dividends are listed.
  //
  // Format: `companies/{company}`, for example `companies/SNP`. Use
  // `companies/-` to list dividends across all companies, as described in
  // [AIP-159](https://google.aip.dev/159).
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "bvb-dividends.example.com/Dividend"},
    (buf.validate.field).string.pattern = "^companies/[^/]+$"
  ];

  // Optional. The maximum number of dividends to return.
  //
  // The service may return fewer. If unspecified, at most 50 dividends are
  // returned. The maximum value is 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. A page token received from a previous `ListDividends` call.
  //
  // Provide this to retrieve the subsequent page. When paginating, all other
  // parameters must match the call that provided the page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An [AIP-160](https://google.aip.dev/160) filter expression.
  //
  // Filterable fields: `company`, `year`, `dividend_type`,
  // `schedule.ex_dividend_date`, `schedule.record_date`,
  // `schedule.payment_start_date`, `schedule.payment_end_date`,
  // `schedule.announcement_date`, `create_time`, `update_time`.
  //
  // Dates are compared against `YYYY-MM-DD` string literals. To match
  // dividends whose date is not set, compare against `null`.
  //
  // Example:
  // `year >= 2024 AND schedule.ex_dividend_date > "2026-01-01"`.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A comma-separated list of fields to sort by, as described in
  // [AIP-132](https://google.aip.dev/132).
  //
  // Sortable fields: `company`, `year`, `schedule.ex_dividend_date`,
  // `schedule.payment_start_date`, `create_time`, `update_time`. The default is
  // `schedule.ex_dividend_date desc`. Append ` desc` to a field to reverse its
  // order.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for
// [DividendsService.ListDividends][bvb.dividends.v1.DividendsService.ListDividends].
message ListDividendsResponse {
  // The dividends on this page, in the requested order.
  repeated Dividend dividends = 1;

  // A token to retrieve the next page, or empty if this is the last page.
  string next_page_token = 2;

  // The total number of dividends matching the filter, across all pages.
  int32 total_size = 3;
}

// Request message for
// [DividendsService.GetDividend][bvb.dividends.v1.DividendsService.GetDividend].
message GetDividendRequest {
  // Required. The resource name of the dividend.
  //
  // Format: `companies/{company}/dividends/{dividend}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bvb-dividends.example.com/Dividend"},
    (buf.validate.field).string.pattern = "^companies/[^/]+/dividends/[^/]+$"
  ];
}
