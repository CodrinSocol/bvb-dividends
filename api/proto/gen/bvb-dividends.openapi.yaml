openapi: 3.1.0
info:
  title: BVB Dividends API
  description: A read-only API over the dividends announced on the Bucharest Stock Exchange (Bursa de Valori Bucuresti). The service speaks both the Connect protocol and the REST mapping described here; they are the same handlers, transcoded.
  version: v1
paths:
  /api/v1/companies:
    get:
      tags:
        - bvb.dividends.v1.CompaniesService
      summary: ListCompanies
      description: Lists companies known to have announced dividends.
      operationId: bvb.dividends.v1.CompaniesService.ListCompanies
      parameters:
        - name: pageSize
          in: query
          description: |-
            Optional. The maximum number of companies to return.

             The service may return fewer. If unspecified, at most 50 companies are
             returned. The maximum value is 1000.
          required: false
          schema:
            type: integer
            title: page_size
            maximum: 1000
            minimum: 0
            format: int32
            description: |-
              (OPTIONAL) Optional. The maximum number of companies to return.

               The service may return fewer. If unspecified, at most 50 companies are
               returned. The maximum value is 1000.
        - name: pageToken
          in: query
          description: |-
            Optional. A page token received from a previous `ListCompanies` call.

             Provide this to retrieve the subsequent page. When paginating, all other
             parameters must match the call that provided the page token.
          required: false
          schema:
            type: string
            title: page_token
            description: |-
              (OPTIONAL) Optional. A page token received from a previous `ListCompanies` call.

               Provide this to retrieve the subsequent page. When paginating, all other
               parameters must match the call that provided the page token.
        - name: filter
          in: query
          description: |-
            Optional. An [AIP-160](https://google.aip.dev/160) filter expression.

             Filterable fields: `symbol`, `display_name`, `create_time`, `update_time`.

             Example: `symbol = "SNP" OR display_name : "BANCA"`.
          required: false
          schema:
            type: string
            title: filter
            description: |-
              (OPTIONAL) Optional. An [AIP-160](https://google.aip.dev/160) filter expression.

               Filterable fields: `symbol`, `display_name`, `create_time`, `update_time`.

               Example: `symbol = "SNP" OR display_name : "BANCA"`.
        - name: orderBy
          in: query
          description: |-
            Optional. A comma-separated list of fields to sort by, as described in
             [AIP-132](https://google.aip.dev/132).

             Sortable fields: `symbol`, `display_name`, `create_time`, `update_time`.
             The default is `symbol`. Append ` desc` to a field to reverse its order,
             for example `display_name desc`.
          required: false
          schema:
            type: string
            title: order_by
            description: |-
              (OPTIONAL) Optional. A comma-separated list of fields to sort by, as described in
               [AIP-132](https://google.aip.dev/132).

               Sortable fields: `symbol`, `display_name`, `create_time`, `update_time`.
               The default is `symbol`. Append ` desc` to a field to reverse its order,
               for example `display_name desc`.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bvb.dividends.v1.ListCompaniesResponse'
  /api/v1/companies/{company}:
    get:
      tags:
        - bvb.dividends.v1.CompaniesService
      summary: GetCompany
      description: Gets a single company.
      operationId: bvb.dividends.v1.CompaniesService.GetCompany
      parameters:
        - name: company
          in: path
          description: The company id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bvb.dividends.v1.Company'
  /api/v1/companies/{company}/dividends:
    get:
      tags:
        - bvb.dividends.v1.DividendsService
      summary: Lists the dividends announced by a company.
      description: |-
        To list dividends across all companies, use `-` as the company ID in
         `parent`, for example `companies/-`.
      operationId: bvb.dividends.v1.DividendsService.ListDividends
      parameters:
        - name: company
          in: path
          description: The company id.
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: |-
            Optional. The maximum number of dividends to return.

             The service may return fewer. If unspecified, at most 50 dividends are
             returned. The maximum value is 1000.
          required: false
          schema:
            type: integer
            title: page_size
            maximum: 1000
            minimum: 0
            format: int32
            description: |-
              (OPTIONAL) Optional. The maximum number of dividends to return.

               The service may return fewer. If unspecified, at most 50 dividends are
               returned. The maximum value is 1000.
        - name: pageToken
          in: query
          description: |-
            Optional. A page token received from a previous `ListDividends` call.

             Provide this to retrieve the subsequent page. When paginating, all other
             parameters must match the call that provided the page token.
          required: false
          schema:
            type: string
            title: page_token
            description: |-
              (OPTIONAL) Optional. A page token received from a previous `ListDividends` call.

               Provide this to retrieve the subsequent page. When paginating, all other
               parameters must match the call that provided the page token.
        - name: filter
          in: query
          description: |-
            Optional. An [AIP-160](https://google.aip.dev/160) filter expression.

             Filterable fields: `company`, `year`, `dividend_type`,
             `schedule.ex_dividend_date`, `schedule.record_date`,
             `schedule.payment_start_date`, `schedule.payment_end_date`,
             `schedule.announcement_date`, `create_time`, `update_time`.

             Dates are compared against `YYYY-MM-DD` string literals. To match
             dividends whose date is not set, compare against `null`.

             Example:
             `year >= 2024 AND schedule.ex_dividend_date > "2026-01-01"`.
          required: false
          schema:
            type: string
            title: filter
            description: |-
              (OPTIONAL) Optional. An [AIP-160](https://google.aip.dev/160) filter expression.

               Filterable fields: `company`, `year`, `dividend_type`,
               `schedule.ex_dividend_date`, `schedule.record_date`,
               `schedule.payment_start_date`, `schedule.payment_end_date`,
               `schedule.announcement_date`, `create_time`, `update_time`.

               Dates are compared against `YYYY-MM-DD` string literals. To match
               dividends whose date is not set, compare against `null`.

               Example:
               `year >= 2024 AND schedule.ex_dividend_date > "2026-01-01"`.
        - name: orderBy
          in: query
          description: |-
            Optional. A comma-separated list of fields to sort by, as described in
             [AIP-132](https://google.aip.dev/132).

             Sortable fields: `company`, `year`, `schedule.ex_dividend_date`,
             `schedule.payment_start_date`, `create_time`, `update_time`. The default is
             `schedule.ex_dividend_date desc`. Append ` desc` to a field to reverse its
             order.
          required: false
          schema:
            type: string
            title: order_by
            description: |-
              (OPTIONAL) Optional. A comma-separated list of fields to sort by, as described in
               [AIP-132](https://google.aip.dev/132).

               Sortable fields: `company`, `year`, `schedule.ex_dividend_date`,
               `schedule.payment_start_date`, `create_time`, `update_time`. The default is
               `schedule.ex_dividend_date desc`. Append ` desc` to a field to reverse its
               order.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bvb.dividends.v1.ListDividendsResponse'
  /api/v1/companies/{company}/dividends/{dividend}:
    get:
      tags:
        - bvb.dividends.v1.DividendsService
      summary: GetDividend
      description: Gets a single dividend.
      operationId: bvb.dividends.v1.DividendsService.GetDividend
      parameters:
        - name: company
          in: path
          description: The company id.
          required: true
          schema:
            type: string
        - name: dividend
          in: path
          description: The dividend id.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bvb.dividends.v1.Dividend'
components:
  schemas:
    bvb.dividends.v1.Company:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            (IDENTIFIER) Identifier. The resource name of the company.

             Format: `companies/{company}`, where `{company}` is the BVB ticker symbol,
             for example `companies/SNP`.
        symbol:
          type: string
          title: symbol
          description: |-
            Output only. The BVB ticker symbol, for example `SNP`.

             This is the same value as the `{company}` segment of `name`, exposed as a
             field for convenience and filtering.
          readOnly: true
        displayName:
          type: string
          title: display_name
          description: |-
            Output only. The full legal name of the company, for example
             `OMV PETROM S.A.`, as reported by BVB.
          readOnly: true
        createTime:
          title: create_time
          description: Output only. The time this company was first imported from BVB.
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updateTime:
          title: update_time
          description: Output only. The time this company was last refreshed from BVB.
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Company
      additionalProperties: false
      description: A company listed on the Bucharest Stock Exchange (Bursa de Valori Bucuresti).
    bvb.dividends.v1.Dividend:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            (IDENTIFIER) Identifier. The resource name of the dividend.

             Format: `companies/{company}/dividends/{dividend}`, for example
             `companies/SNP/dividends/8f14e45f-ceea-5a04-a6f3-2f4b1a9c0d33`.
        year:
          type: integer
          title: year
          format: int32
          description: Output only. The fiscal year the dividend relates to, for example `2025`.
          readOnly: true
        dividendType:
          type: string
          title: dividend_type
          description: |-
            Output only. The type of dividend as reported by BVB, for example `cash`.

             This is an open set owned by BVB rather than by this API, so it is
             represented as a string and passed through unmodified.
          readOnly: true
        grossPerShareNaturalPerson:
          title: gross_per_share_natural_person
          description: |-
            Output only. Gross dividend per share payable to natural persons, before
             withholding tax.
          readOnly: true
          $ref: '#/components/schemas/google.type.Money'
        grossPerShareLegalPerson:
          title: gross_per_share_legal_person
          description: |-
            Output only. Gross dividend per share payable to legal persons, before
             withholding tax.
          readOnly: true
          $ref: '#/components/schemas/google.type.Money'
        totalAmount:
          title: total_amount
          description: Output only. The total amount distributed across all shares.
          readOnly: true
          $ref: '#/components/schemas/google.type.Money'
        schedule:
          title: schedule
          description: Output only. The key dates of the dividend.
          readOnly: true
          $ref: '#/components/schemas/bvb.dividends.v1.Schedule'
        distributionMethod:
          type: string
          title: distribution_method
          description: |-
            Output only. How the dividend is paid out, as described by BVB, for example
             `bank transfer`.
          readOnly: true
        state:
          title: state
          description: |-
            Output only. The stage this dividend has reached, derived from `schedule`
             at the time of the request.
          readOnly: true
          $ref: '#/components/schemas/bvb.dividends.v1.Dividend.State'
        createTime:
          title: create_time
          description: Output only. The time this dividend was first imported from BVB.
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updateTime:
          title: update_time
          description: Output only. The time this dividend was last refreshed from BVB.
          readOnly: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Dividend
      additionalProperties: false
      description: |-
        A dividend announced by a company listed on the Bucharest Stock Exchange.

         A dividend is identified by the company that declared it, the fiscal year it
         relates to, its type, and its ex-dividend date. That tuple is stable across
         imports, so a dividend keeps the same resource name for its whole lifetime.
    bvb.dividends.v1.Dividend.State:
      type: string
      title: State
      enum:
        - STATE_UNSPECIFIED
        - STATE_ANNOUNCED
        - STATE_EX_PASSED
        - STATE_PAYING
        - STATE_PAID
        - STATE_UNDATED
      description: |-
        The stage a dividend has reached in its lifecycle.

         Derived from the schedule at read time; it is not stored.
    bvb.dividends.v1.GetCompanyRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          pattern: ^companies/[^/]+$
          description: |-
            Required. The resource name of the company.

             Format: `companies/{company}`, for example `companies/SNP`.
      title: GetCompanyRequest
      required:
        - name
      additionalProperties: false
      description: |-
        Request message for
         [CompaniesService.GetCompany][bvb.dividends.v1.CompaniesService.GetCompany].
    bvb.dividends.v1.GetDividendRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          pattern: ^companies/[^/]+/dividends/[^/]+$
          description: |-
            Required. The resource name of the dividend.

             Format: `companies/{company}/dividends/{dividend}`.
      title: GetDividendRequest
      required:
        - name
      additionalProperties: false
      description: |-
        Request message for
         [DividendsService.GetDividend][bvb.dividends.v1.DividendsService.GetDividend].
    bvb.dividends.v1.ListCompaniesRequest:
      type: object
      properties:
        pageSize:
          type: integer
          title: page_size
          maximum: 1000
          minimum: 0
          format: int32
          description: |-
            (OPTIONAL) Optional. The maximum number of companies to return.

             The service may return fewer. If unspecified, at most 50 companies are
             returned. The maximum value is 1000.
        pageToken:
          type: string
          title: page_token
          description: |-
            (OPTIONAL) Optional. A page token received from a previous `ListCompanies` call.

             Provide this to retrieve the subsequent page. When paginating, all other
             parameters must match the call that provided the page token.
        filter:
          type: string
          title: filter
          description: |-
            (OPTIONAL) Optional. An [AIP-160](https://google.aip.dev/160) filter expression.

             Filterable fields: `symbol`, `display_name`, `create_time`, `update_time`.

             Example: `symbol = "SNP" OR display_name : "BANCA"`.
        orderBy:
          type: string
          title: order_by
          description: |-
            (OPTIONAL) Optional. A comma-separated list of fields to sort by, as described in
             [AIP-132](https://google.aip.dev/132).

             Sortable fields: `symbol`, `display_name`, `create_time`, `update_time`.
             The default is `symbol`. Append ` desc` to a field to reverse its order,
             for example `display_name desc`.
      title: ListCompaniesRequest
      additionalProperties: false
      description: |-
        Request message for
         [CompaniesService.ListCompanies][bvb.dividends.v1.CompaniesService.ListCompanies].
    bvb.dividends.v1.ListCompaniesResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/bvb.dividends.v1.Company'
          title: companies
          description: The companies on this page, in the requested order.
        nextPageToken:
          type: string
          title: next_page_token
          description: A token to retrieve the next page, or empty if this is the last page.
        totalSize:
          type: integer
          title: total_size
          format: int32
          description: The total number of companies matching the filter, across all pages.
      title: ListCompaniesResponse
      additionalProperties: false
      description: |-
        Response message for
         [CompaniesService.ListCompanies][bvb.dividends.v1.CompaniesService.ListCompanies].
    bvb.dividends.v1.ListDividendsRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          pattern: ^companies/[^/]+$
          description: |-
            Required. The company whose dividends are listed.

             Format: `companies/{company}`, for example `companies/SNP`. Use
             `companies/-` to list dividends across all companies, as described in
             [AIP-159](https://google.aip.dev/159).
        pageSize:
          type: integer
          title: page_size
          maximum: 1000
          minimum: 0
          format: int32
          description: |-
            (OPTIONAL) Optional. The maximum number of dividends to return.

             The service may return fewer. If unspecified, at most 50 dividends are
             returned. The maximum value is 1000.
        pageToken:
          type: string
          title: page_token
          description: |-
            (OPTIONAL) Optional. A page token received from a previous `ListDividends` call.

             Provide this to retrieve the subsequent page. When paginating, all other
             parameters must match the call that provided the page token.
        filter:
          type: string
          title: filter
          description: |-
            (OPTIONAL) Optional. An [AIP-160](https://google.aip.dev/160) filter expression.

             Filterable fields: `company`, `year`, `dividend_type`,
             `schedule.ex_dividend_date`, `schedule.record_date`,
             `schedule.payment_start_date`, `schedule.payment_end_date`,
             `schedule.announcement_date`, `create_time`, `update_time`.

             Dates are compared against `YYYY-MM-DD` string literals. To match
             dividends whose date is not set, compare against `null`.

             Example:
             `year >= 2024 AND schedule.ex_dividend_date > "2026-01-01"`.
        orderBy:
          type: string
          title: order_by
          description: |-
            (OPTIONAL) Optional. A comma-separated list of fields to sort by, as described in
             [AIP-132](https://google.aip.dev/132).

             Sortable fields: `company`, `year`, `schedule.ex_dividend_date`,
             `schedule.payment_start_date`, `create_time`, `update_time`. The default is
             `schedule.ex_dividend_date desc`. Append ` desc` to a field to reverse its
             order.
      title: ListDividendsRequest
      required:
        - parent
      additionalProperties: false
      description: |-
        Request message for
         [DividendsService.ListDividends][bvb.dividends.v1.DividendsService.ListDividends].
    bvb.dividends.v1.ListDividendsResponse:
      type: object
      properties:
        dividends:
          type: array
          items:
            $ref: '#/components/schemas/bvb.dividends.v1.Dividend'
          title: dividends
          description: The dividends on this page, in the requested order.
        nextPageToken:
          type: string
          title: next_page_token
          description: A token to retrieve the next page, or empty if this is the last page.
        totalSize:
          type: integer
          title: total_size
          format: int32
          description: The total number of dividends matching the filter, across all pages.
      title: ListDividendsResponse
      additionalProperties: false
      description: |-
        Response message for
         [DividendsService.ListDividends][bvb.dividends.v1.DividendsService.ListDividends].
    bvb.dividends.v1.Schedule:
      type: object
      properties:
        announcementDate:
          title: announcement_date
          description: (OPTIONAL) The date the dividend was announced.
          $ref: '#/components/schemas/google.type.Date'
        gmsReferenceDate:
          title: gms_reference_date
          description: (OPTIONAL) The reference date used for the general meeting of shareholders.
          $ref: '#/components/schemas/google.type.Date'
        gmsDate:
          title: gms_date
          description: (OPTIONAL) The date of the general meeting of shareholders that approved the dividend.
          $ref: '#/components/schemas/google.type.Date'
        recordDate:
          title: record_date
          description: (OPTIONAL) The date on which share ownership is recorded for entitlement.
          $ref: '#/components/schemas/google.type.Date'
        exDividendDate:
          title: ex_dividend_date
          description: |-
            (OPTIONAL) The first date on which the share trades without entitlement to this
             dividend. Buying on or after this date does not earn the dividend.
          $ref: '#/components/schemas/google.type.Date'
        paymentStartDate:
          title: payment_start_date
          description: (OPTIONAL) The first date on which the dividend is paid.
          $ref: '#/components/schemas/google.type.Date'
        paymentEndDate:
          title: payment_end_date
          description: (OPTIONAL) The last date on which the dividend is paid.
          $ref: '#/components/schemas/google.type.Date'
      title: Schedule
      additionalProperties: false
      description: |-
        The key dates of a dividend.

         Every date is optional: BVB publishes them progressively as a dividend moves
         from announcement to payment, so an early-stage dividend has most of these
         unset. Absent dates are unset rather than zero.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    google.type.Date:
      type: object
      properties:
        year:
          type: integer
          title: year
          format: int32
          description: |-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date without
             a year.
        month:
          type: integer
          title: month
          format: int32
          description: |-
            Month of a year. Must be from 1 to 12, or 0 to specify a year without a
             month and day.
        day:
          type: integer
          title: day
          format: int32
          description: |-
            Day of a month. Must be from 1 to 31 and valid for the year and month, or 0
             to specify a year by itself or a year and month where the day isn't
             significant.
      title: Date
      additionalProperties: false
      description: |-
        Represents a whole or partial calendar date, such as a birthday. The time of
         day and time zone are either specified elsewhere or are insignificant. The
         date is relative to the Gregorian Calendar. This can represent one of the
         following:

         * A full date, with non-zero year, month, and day values.
         * A month and day, with a zero year (for example, an anniversary).
         * A year on its own, with a zero month and a zero day.
         * A year and month, with a zero day (for example, a credit card expiration
           date).

         Related types:

         * [google.type.TimeOfDay][google.type.TimeOfDay]
         * [google.type.DateTime][google.type.DateTime]
         * [google.protobuf.Timestamp][google.protobuf.Timestamp]
    google.type.Money:
      type: object
      properties:
        currencyCode:
          type: string
          title: currency_code
          description: The three-letter currency code defined in ISO 4217.
        units:
          type:
            - integer
            - string
          title: units
          format: int64
          description: |-
            The whole units of the amount.
             For example if `currencyCode` is `"USD"`, then 1 unit is one US dollar.
        nanos:
          type: integer
          title: nanos
          format: int32
          description: |-
            Number of nano (10^-9) units of the amount.
             The value must be between -999,999,999 and +999,999,999 inclusive.
             If `units` is positive, `nanos` must be positive or zero.
             If `units` is zero, `nanos` can be positive, zero, or negative.
             If `units` is negative, `nanos` must be negative or zero.
             For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
      title: Money
      additionalProperties: false
      description: Represents an amount of money with its currency type.
