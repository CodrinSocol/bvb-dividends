tags:
  - name: bvb.dividends.v1.CompaniesService
    description: |-
      Read-only access to the companies known to this service.

       Companies are discovered by the daily import from the BVB financials web
       service; they are never created through this API. Every method is public,
       unauthenticated, safe and idempotent.
  - name: bvb.dividends.v1.DividendsService
    description: |-
      Read-only access to the dividends announced on the Bucharest Stock Exchange.

       Data is imported from the BVB financials web service on a daily schedule.
       Every method is public, unauthenticated, safe and idempotent.
