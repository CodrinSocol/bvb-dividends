# Generated with protoc-gen-openapi, then corrected by
# scripts/fix-openapi-dates.py; see that script for why.
openapi: 3.0.3
info:
  title: BVB Dividends API
  description: "Read-only access to companies and dividends on the Bucharest Stock Exchange.\n\n Data\
    \ is imported from the BVB financials web service on a daily schedule.\n The API is public and unauthenticated;\
    \ all methods are safe and idempotent."
  version: v1
servers:
- url: https://bvb-dividends.example.com
paths:
  /v1/companies:
    get:
      tags:
      - DividendsService
      description: Lists companies known to have announced dividends.
      operationId: DividendsService_ListCompanies
      parameters:
      - name: pageSize
        in: query
        description: "Optional. The maximum number of companies to return.\n\n The service may return\
          \ fewer. If unspecified, at most 50 companies are\n returned. The maximum value is 1000; values\
          \ above 1000 are coerced to 1000."
        schema:
          type: integer
          format: int32
      - name: pageToken
        in: query
        description: "Optional. A page token received from a previous `ListCompanies` call.\n\n Provide\
          \ this to retrieve the subsequent page. When paginating, all other\n parameters must match the\
          \ call that provided the page token."
        schema:
          type: string
      - name: filter
        in: query
        description: "Optional. An [AIP-160](https://google.aip.dev/160) filter expression.\n\n Filterable\
          \ fields: `symbol`, `display_name`, `create_time`, `update_time`.\n\n Example: `symbol = \"\
          SNP\" OR display_name : \"BANCA\"`."
        schema:
          type: string
      - name: orderBy
        in: query
        description: "Optional. A comma-separated list of fields to sort by, as described in\n [AIP-132](https://google.aip.dev/132).\n\
          \n Sortable fields: `symbol`, `display_name`, `create_time`, `update_time`.\n The default is\
          \ `symbol`. Append ` desc` to a field to reverse its order,\n for example `display_name desc`."
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCompaniesResponse'
  /v1/companies/{company}:
    get:
      tags:
      - DividendsService
      description: Gets a single company.
      operationId: DividendsService_GetCompany
      parameters:
      - name: company
        in: path
        description: The company id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
  /v1/companies/{company}/dividends:
    get:
      tags:
      - DividendsService
      description: "Lists the dividends announced by a company.\n\n To list dividends across all companies,\
        \ use `-` as the company ID in\n `parent`, for example `companies/-`."
      operationId: DividendsService_ListDividends
      parameters:
      - name: company
        in: path
        description: The company id.
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: "Optional. The maximum number of dividends to return.\n\n The service may return\
          \ fewer. If unspecified, at most 50 dividends are\n returned. The maximum value is 1000; values\
          \ above 1000 are coerced to 1000."
        schema:
          type: integer
          format: int32
      - name: pageToken
        in: query
        description: "Optional. A page token received from a previous `ListDividends` call.\n\n Provide\
          \ this to retrieve the subsequent page. When paginating, all other\n parameters must match the\
          \ call that provided the page token."
        schema:
          type: string
      - name: filter
        in: query
        description: "Optional. An [AIP-160](https://google.aip.dev/160) filter expression.\n\n Filterable\
          \ fields: `company`, `year`, `dividend_type`,\n `schedule.ex_dividend_date`, `schedule.record_date`,\n\
          \ `schedule.payment_start_date`, `schedule.payment_end_date`,\n `schedule.announcement_date`,\
          \ `create_time`, `update_time`.\n\n Dates are compared against `YYYY-MM-DD` string literals.\
          \ To match\n dividends whose date is not set, compare against `null`.\n\n Example:\n `year >=\
          \ 2024 AND schedule.ex_dividend_date > \"2026-01-01\"`."
        schema:
          type: string
      - name: orderBy
        in: query
        description: "Optional. A comma-separated list of fields to sort by, as described in\n [AIP-132](https://google.aip.dev/132).\n\
          \n Sortable fields: `company`, `year`, `schedule.ex_dividend_date`,\n `schedule.payment_start_date`,\
          \ `create_time`, `update_time`. The default is\n `schedule.ex_dividend_date desc`. Append `\
          \ desc` to a field to reverse its\n order."
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDividendsResponse'
  /v1/companies/{company}/dividends/{dividend}:
    get:
      tags:
      - DividendsService
      description: Gets a single dividend.
      operationId: DividendsService_GetDividend
      parameters:
      - name: company
        in: path
        description: The company id.
        required: true
        schema:
          type: string
      - name: dividend
        in: path
        description: The dividend id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dividend'
components:
  schemas:
    Company:
      type: object
      properties:
        name:
          type: string
          description: "Identifier. The resource name of the company.\n\n Format: `companies/{company}`,\
            \ where `{company}` is the BVB ticker symbol,\n for example `companies/SNP`."
        symbol:
          readOnly: true
          type: string
          description: "Output only. The BVB ticker symbol, for example `SNP`.\n\n This is the same value\
            \ as the `{company}` segment of `name`, exposed as a\n field for convenience and filtering."
        displayName:
          readOnly: true
          type: string
          description: "Output only. The full legal name of the company, for example\n `OMV PETROM S.A.`,\
            \ as reported by BVB."
        createTime:
          readOnly: true
          type: string
          description: Output only. The time this company was first imported from BVB.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Output only. The time this company was last refreshed from BVB.
          format: date-time
      description: "A company listed on the Bucharest Stock Exchange (Bursa de Valori Bucuresti).\n\n\
        \ Companies are discovered from the BVB financials web service; they are never\n created directly\
        \ through this API."
    Dividend:
      type: object
      properties:
        name:
          type: string
          description: "Identifier. The resource name of the dividend.\n\n Format: `companies/{company}/dividends/{dividend}`,\
            \ for example\n `companies/SNP/dividends/8f14e45f-ceea-5a04-a6f3-2f4b1a9c0d33`."
        year:
          readOnly: true
          type: integer
          description: Output only. The fiscal year the dividend relates to, for example `2025`.
          format: int32
        dividendType:
          readOnly: true
          type: string
          description: "Output only. The type of dividend as reported by BVB, for example `cash`.\n\n\
            \ This is an open set owned by BVB rather than by this API, so it is\n represented as a string\
            \ and passed through unmodified."
        grossPerShareNaturalPerson:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Money'
          description: "Output only. Gross dividend per share payable to natural persons, before\n withholding\
            \ tax."
        grossPerShareLegalPerson:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Money'
          description: "Output only. Gross dividend per share payable to legal persons, before\n withholding\
            \ tax."
        totalAmount:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Output only. The total amount distributed across all shares.
        schedule:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Schedule'
          description: Output only. The key dates of the dividend.
        distributionMethod:
          readOnly: true
          type: string
          description: "Output only. How the dividend is paid out, as described by BVB, for example\n\
            \ `bank transfer`."
        state:
          readOnly: true
          enum:
          - STATE_UNSPECIFIED
          - STATE_ANNOUNCED
          - STATE_EX_PASSED
          - STATE_PAYING
          - STATE_PAID
          - STATE_UNDATED
          type: string
          description: "Output only. The stage this dividend has reached, derived from `schedule`\n at\
            \ the time of the request."
          format: enum
        createTime:
          readOnly: true
          type: string
          description: Output only. The time this dividend was first imported from BVB.
          format: date-time
        updateTime:
          readOnly: true
          type: string
          description: Output only. The time this dividend was last refreshed from BVB.
          format: date-time
      description: "A dividend announced by a company listed on the Bucharest Stock Exchange.\n\n A dividend\
        \ is identified by the company that declared it, the fiscal year it\n relates to, its type, and\
        \ its ex-dividend date. That tuple is stable across\n imports, so a dividend keeps the same resource\
        \ name for its whole lifetime."
    ListCompaniesResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'
          description: The companies on this page, in the requested order.
        nextPageToken:
          type: string
          description: A token to retrieve the next page, or empty if this is the last page.
        totalSize:
          type: integer
          description: The total number of companies matching the filter, across all pages.
          format: int32
      description: "Response message for\n [DividendsService.ListCompanies][bvb.dividends.v1.DividendsService.ListCompanies]."
    ListDividendsResponse:
      type: object
      properties:
        dividends:
          type: array
          items:
            $ref: '#/components/schemas/Dividend'
          description: The dividends on this page, in the requested order.
        nextPageToken:
          type: string
          description: A token to retrieve the next page, or empty if this is the last page.
        totalSize:
          type: integer
          description: The total number of dividends matching the filter, across all pages.
          format: int32
      description: "Response message for\n [DividendsService.ListDividends][bvb.dividends.v1.DividendsService.ListDividends]."
    Money:
      type: object
      properties:
        currencyCode:
          type: string
          description: The three-letter currency code defined in ISO 4217.
        units:
          type: string
          description: "The whole units of the amount.\n For example if `currencyCode` is `\"USD\"`, then\
            \ 1 unit is one US dollar."
        nanos:
          type: integer
          description: "Number of nano (10^-9) units of the amount.\n The value must be between -999,999,999\
            \ and +999,999,999 inclusive.\n If `units` is positive, `nanos` must be positive or zero.\n\
            \ If `units` is zero, `nanos` can be positive, zero, or negative.\n If `units` is negative,\
            \ `nanos` must be negative or zero.\n For example $-1.75 is represented as `units`=-1 and\
            \ `nanos`=-750,000,000."
          format: int32
      description: Represents an amount of money with its currency type.
    Schedule:
      type: object
      properties:
        announcementDate:
          allOf:
          - $ref: '#/components/schemas/GoogleTypeDate'
          description: The date the dividend was announced.
        gmsReferenceDate:
          allOf:
          - $ref: '#/components/schemas/GoogleTypeDate'
          description: The reference date used for the general meeting of shareholders.
        gmsDate:
          allOf:
          - $ref: '#/components/schemas/GoogleTypeDate'
          description: The date of the general meeting of shareholders that approved the dividend.
        recordDate:
          allOf:
          - $ref: '#/components/schemas/GoogleTypeDate'
          description: The date on which share ownership is recorded for entitlement.
        exDividendDate:
          allOf:
          - $ref: '#/components/schemas/GoogleTypeDate'
          description: "The first date on which the share trades without entitlement to this\n dividend.\
            \ Buying on or after this date does not earn the dividend."
        paymentStartDate:
          allOf:
          - $ref: '#/components/schemas/GoogleTypeDate'
          description: The first date on which the dividend is paid.
        paymentEndDate:
          allOf:
          - $ref: '#/components/schemas/GoogleTypeDate'
          description: The last date on which the dividend is paid.
      description: "The key dates of a dividend.\n\n Every date is optional: BVB publishes them progressively\
        \ as a dividend moves\n from announcement to payment, so an early-stage dividend has most of these\n\
        \ unset. Absent dates are unset rather than zero."
    GoogleTypeDate:
      type: object
      description: A calendar date, as google.type.Date. A year on its own, or a year and month with a
        zero day, denotes a whole year or month.
      properties:
        year:
          type: integer
          format: int32
          description: Year of the date.
        month:
          type: integer
          format: int32
          description: Month of the year, 1 to 12.
        day:
          type: integer
          format: int32
          description: Day of the month, 1 to 31.
tags:
- name: DividendsService
