name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The integration tests refuse to run unless the database name says it is a
  # test database, because they truncate between cases.
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bvb_dividends_test?sslmode=disable

jobs:
  api:
    name: API contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # buf breaking compares against main, which needs its history.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          # go.work (via tools/go.mod) pins a newer toolchain than the
          # application's own go.mod, and every step below runs with the
          # workspace enabled, so the version has to come from go.work.
          go-version-file: go.work
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # Enforces the AIPs against the proto descriptors. This is the check that
      # makes "AIP-compliant" a property of the build rather than a claim.
      - name: Lint the API against the AIPs
        run: bunx nx run proto:lint:proto

      - name: Check for breaking API changes
        if: github.event_name == 'pull_request'
        run: bunx nx run proto:breaking

      # Generated code is committed so editors and gopls work without a build
      # step; these fail if what is committed is not what the inputs produce.
      - name: Check the generated clients are current
        run: bunx nx run proto:check-generated

      - name: Check the generated queries are current
        run: bunx nx run db:check-generated

  go:
    name: Go
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bvb_dividends_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # go.work (via tools/go.mod) pins a newer toolchain than the
          # application's own go.mod; go vet, golangci-lint and go test below
          # all run with the workspace enabled, so the version has to come
          # from go.work.
          go-version-file: go.work
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # The module has to build without the workspace, because the container
      # image and any consumer of it build it that way.
      - name: Build without the tools workspace
        env:
          GOWORK: "off"
        run: go build ./...

      - run: go vet ./...

      # The linter is pinned in tools/go.mod, so CI and a developer's machine
      # run the same version.
      - run: go tool golangci-lint run

      # The slices' schemas are applied at startup, in dependency order, so the
      # migrations are covered by every test that touches the database.
      - name: Test
        run: go test -race -count=1 ./...

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # The client is generated from the committed protos and the application
      # type-checks against it, so a client that has drifted fails here.
      - name: Build
        run: bunx nx run web:build

      - name: Test
        run: bunx nx run web:test

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # One image: the web application is built and embedded into the binary
      # that serves it.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
