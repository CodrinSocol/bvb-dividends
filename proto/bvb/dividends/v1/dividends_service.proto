//
// The read-only public API for Bucharest Stock Exchange dividend data.

syntax = "proto3";

package bvb.dividends.v1;

import "bvb/dividends/v1/company.proto";
import "bvb/dividends/v1/dividend.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option java_multiple_files = true;
option java_outer_classname = "DividendsServiceProto";
option java_package = "com.bvb.dividends.v1";
option go_package = "github.com/CodrinSocol/bvb-dividends-ro/libs/genproto/bvb/dividends/v1;dividendsv1";

// Read-only access to companies and dividends on the Bucharest Stock Exchange.
//
// Data is imported from the BVB financials web service on a daily schedule.
// The API is public and unauthenticated; all methods are safe and idempotent.
service DividendsService {
  option (google.api.default_host) = "bvb-dividends.example.com";

  // Lists companies known to have announced dividends.
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse) {
    option (google.api.http) = {get: "/v1/companies"};
  }

  // Gets a single company.
  rpc GetCompany(GetCompanyRequest) returns (Company) {
    option (google.api.http) = {get: "/v1/{name=companies/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the dividends announced by a company.
  //
  // To list dividends across all companies, use `-` as the company ID in
  // `parent`, for example `companies/-`.
  rpc ListDividends(ListDividendsRequest) returns (ListDividendsResponse) {
    option (google.api.http) = {get: "/v1/{parent=companies/*}/dividends"};
    option (google.api.method_signature) = "parent";
  }

  // Gets a single dividend.
  rpc GetDividend(GetDividendRequest) returns (Dividend) {
    option (google.api.http) = {get: "/v1/{name=companies/*/dividends/*}"};
    option (google.api.method_signature) = "name";
  }
}

// Request message for
// [DividendsService.ListCompanies][bvb.dividends.v1.DividendsService.ListCompanies].
message ListCompaniesRequest {
  // Optional. The maximum number of companies to return.
  //
  // The service may return fewer. If unspecified, at most 50 companies are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token received from a previous `ListCompanies` call.
  //
  // Provide this to retrieve the subsequent page. When paginating, all other
  // parameters must match the call that provided the page token.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An [AIP-160](https://google.aip.dev/160) filter expression.
  //
  // Filterable fields: `symbol`, `display_name`, `create_time`, `update_time`.
  //
  // Example: `symbol = "SNP" OR display_name : "BANCA"`.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A comma-separated list of fields to sort by, as described in
  // [AIP-132](https://google.aip.dev/132).
  //
  // Sortable fields: `symbol`, `display_name`, `create_time`, `update_time`.
  // The default is `symbol`. Append ` desc` to a field to reverse its order,
  // for example `display_name desc`.
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for
// [DividendsService.ListCompanies][bvb.dividends.v1.DividendsService.ListCompanies].
message ListCompaniesResponse {
  // The companies on this page, in the requested order.
  repeated Company companies = 1;

  // A token to retrieve the next page, or empty if this is the last page.
  string next_page_token = 2;

  // The total number of companies matching the filter, across all pages.
  int32 total_size = 3;
}

// Request message for
// [DividendsService.GetCompany][bvb.dividends.v1.DividendsService.GetCompany].
message GetCompanyRequest {
  // Required. The resource name of the company.
  //
  // Format: `companies/{company}`, for example `companies/SNP`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bvb-dividends.example.com/Company"}
  ];
}

// Request message for
// [DividendsService.ListDividends][bvb.dividends.v1.DividendsService.ListDividends].
message ListDividendsRequest {
  // Required. The company whose dividends are listed.
  //
  // Format: `companies/{company}`, for example `companies/SNP`. Use
  // `companies/-` to list dividends across all companies, as described in
  // [AIP-159](https://google.aip.dev/159).
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "bvb-dividends.example.com/Dividend"}
  ];

  // Optional. The maximum number of dividends to return.
  //
  // The service may return fewer. If unspecified, at most 50 dividends are
  // returned. The maximum value is 1000; values above 1000 are coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token received from a previous `ListDividends` call.
  //
  // Provide this to retrieve the subsequent page. When paginating, all other
  // parameters must match the call that provided the page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An [AIP-160](https://google.aip.dev/160) filter expression.
  //
  // Filterable fields: `company`, `year`, `dividend_type`,
  // `schedule.ex_dividend_date`, `schedule.record_date`,
  // `schedule.payment_start_date`, `schedule.payment_end_date`,
  // `schedule.announcement_date`, `create_time`, `update_time`.
  //
  // Dates are compared against `YYYY-MM-DD` string literals. To match
  // dividends whose date is not set, compare against `null`.
  //
  // Example:
  // `year >= 2024 AND schedule.ex_dividend_date > "2026-01-01"`.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A comma-separated list of fields to sort by, as described in
  // [AIP-132](https://google.aip.dev/132).
  //
  // Sortable fields: `company`, `year`, `schedule.ex_dividend_date`,
  // `schedule.payment_start_date`, `create_time`, `update_time`. The default is
  // `schedule.ex_dividend_date desc`. Append ` desc` to a field to reverse its
  // order.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for
// [DividendsService.ListDividends][bvb.dividends.v1.DividendsService.ListDividends].
message ListDividendsResponse {
  // The dividends on this page, in the requested order.
  repeated Dividend dividends = 1;

  // A token to retrieve the next page, or empty if this is the last page.
  string next_page_token = 2;

  // The total number of dividends matching the filter, across all pages.
  int32 total_size = 3;
}

// Request message for
// [DividendsService.GetDividend][bvb.dividends.v1.DividendsService.GetDividend].
message GetDividendRequest {
  // Required. The resource name of the dividend.
  //
  // Format: `companies/{company}/dividends/{dividend}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bvb-dividends.example.com/Dividend"}
  ];
}
