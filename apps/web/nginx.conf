server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed assets never change under the same name, so they cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The client is a single-page app: any path it owns has to resolve to the
    # entry document so a deep link opens the right view instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
