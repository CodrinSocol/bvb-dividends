# Type-safe Go from hand-written SQL.
#
# Each vertical slice has a block of its own: its schema, its queries and its
# own generated package, so a slice's SQL never reaches another's. sqlc is run
# from the repository root, which is where the Nx target and the go.work
# workspace put it.
#
# The List queries are not generated: their WHERE clause is compiled from an
# AIP-160 filter at request time, so they are built - parameterised - by
# internal/common/postgres.
version: "2"
overrides:
  go:
    overrides:
      - db_type: timestamptz
        nullable: false
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: Time
          import: time
          pointer: true
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
sql:
  - engine: postgresql
    schema: internal/companies/infra/repo/postgres/schema
    queries: internal/companies/infra/repo/postgres/query
    gen:
      go:
        out: internal/companies/infra/repo/postgres/gen
        package: gen
        sql_package: pgx/v5
        emit_db_tags: true
        emit_json_tags: true
        emit_empty_slices: true
